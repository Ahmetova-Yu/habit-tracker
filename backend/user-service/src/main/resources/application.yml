server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/habit_tracker}
    username: ${DB_USER:habit}
    password: ${DB_PASSWORD:habit}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:change-me-in-production-at-least-32-bytes-long-for-hs256}
  access-ttl: 15m
  refresh-ttl: 7d

logging:
  level:
    com.habittracker: DEBUG