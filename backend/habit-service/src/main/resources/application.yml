server:
  port: 8082

spring:
  application:
    name: habit-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/habit_tracker?currentSchema=habit}
    username: ${DB_USER:habit}
    password: ${DB_PASSWORD:habit}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: habit
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: habit
    default-schema: habit
    table: flyway_schema_history

logging:
  level:
    com.habittracker: DEBUG