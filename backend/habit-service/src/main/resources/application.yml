server:
  port: 8082

spring:
  application:
    name: habit-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/habit_tracker}
    username: ${DB_USER:habit}
    password: ${DB_PASSWORD:habit}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration